horizons_days: [1, 3, 5, 10, 20]
price_basis: raw # Keep aligned with signals until reviewed adjustments are approved.
min_independent_events: 30
sample_split:
  in_sample_fraction: 0.7
costs:
  fees_pct_per_side: 0.10
  slippage_pct_per_side: 0.05
  assumption: "Illustrative placeholders, not verified broker charges"
timing:
  entry: next_open
  exit_for_events: horizon_close
exclusions:
  around_split_flag_days: 20
risk:
  risk_free_rate_annual: 0.0
  trading_days_per_year: 250
initial_capital: 100000
strategies:
  sma_cross: {fast: 50, slow: 200}
  rsi_reversion: {period: 14, entry_below: 30, exit_above: 50, max_hold_days: 20}
  pattern_trend: {pattern: cdl_engulfing, trend: uptrend, hold_days: 10}
