prompt_version: v3
debate_rounds: 2
horizon_days_default: 10
allowed_horizons: [1,3,5,10,20]
roles: [technical_analyst,news_analyst,bull,bear,risk_manager,summariser]
gating:
  new_signal_types: [pattern,indicator,level]
  new_news_event_min_importance: 3
  price_move_atr_multiple: 1.5
  upcoming_corporate_action_days: 5
  days_since_last_report: 7
  stale_data_max_trading_days: 3
evidence_pack:
  candles_days: 60
  signals_days: 30
  news_days: 14
  max_news_items: 20
  max_prompt_characters: 90000
  max_pack_characters: 350000
policy:
  forbid_terms: ['buy now','sell now','strong buy','strong sell','price target','stop loss','stop-loss','position size','go long','go short','guaranteed','sure shot']
  max_regeneration_attempts: 1
news_accuracy_review: pending_human_review
