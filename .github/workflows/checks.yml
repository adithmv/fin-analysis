name: Check project
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt -e ./shared
      - run: python -m pytest -q
      - run: python -m pytest ops/tests -q
      - run: ruff check shared ingest logbook scripts
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt -e ./shared feedparser==6.0.14 rapidfuzz==3.14.6 langdetect==1.0.9 tzdata==2026.5
      - run: python -m pytest news/tests -q
      - run: ruff check news backtest signals
  research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [signals, backtest, analysis-agents, scheduler, alerts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ${{ matrix.module }}/requirements-lock.txt -e ./shared
      - run: python -m pytest ${{ matrix.module }}/tests -q
  browser:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browser-agent/.venv/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r browser-agent/requirements-lock.txt -e ./shared
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest browser-agent/tests -q
