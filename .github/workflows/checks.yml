name: Check project
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt -e ./shared
      - run: python -m pytest -q
      - run: ruff check shared ingest logbook scripts
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
  research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [signals, backtest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ${{ matrix.module }}/requirements-lock.txt -e ./shared
      - run: python -m pytest ${{ matrix.module }}/tests -q
